<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bears">
<meta name="description" content="Bears Rating — интерактивный прототип">
<meta property="og:title" content="Bears Rating">
<meta property="og:description" content="Интерактивный прототип">
<meta property="og:type" content="website">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Bears Rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Макет Figma «Rating», экран 390×844. Цвета, размеры и шрифты — из макета. */
:root{
  --black:#050505; --white:#fff; --pink:#ff36a2; --green:#9bdb60; --gray:#b2b2b2;
  --font:-apple-system,"SF Pro Display","SF Pro Text",BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
  --sw:0px; color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none}
body{font-family:var(--font);color:var(--black);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:none;-webkit-user-drag:none;pointer-events:none}

/* ---------- Сцена: телефон + переключатель ---------- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.app{position:absolute;left:0;top:0;width:390px;transform-origin:0 0;overflow:hidden;background:#fff}
.switcher{flex:none;height:calc(var(--sw) + env(safe-area-inset-bottom,0px));padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#f2f2f4;
  display:flex;gap:6px;align-items:stretch;border-top:1px solid rgba(0,0,0,.06)}
.switcher button{flex:1;min-width:0;border-radius:14px;font-size:12.5px;line-height:1.15;font-weight:500;color:rgba(5,5,5,.55);padding:0 6px;transition:background .25s,color .25s,box-shadow .25s}
.switcher button.on{background:#fff;color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.switcher button b{display:block;font-size:11px;font-weight:600;color:var(--pink);margin-bottom:2px}

@media (min-width:640px) and (min-height:720px){
  .stage{background:#e9e9ec;align-items:center;justify-content:center;gap:18px}
  .viewport{flex:none;border-radius:58px;box-shadow:0 0 0 10px #111,0 40px 90px rgba(0,0,0,.28);overflow:hidden}
  .switcher{height:auto;padding:6px;border-radius:18px;border:0;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.08);width:540px}
  .switcher button{padding:10px 8px;font-size:13px}
  .switcher button.on{background:#f2f2f4;box-shadow:none}
}

/* ---------- Верхний блок ---------- */
.container{touch-action:pan-y;position:absolute;left:0;top:0;width:390px;height:var(--ch,580px);border-radius:41px;overflow:hidden;transition:height .55s cubic-bezier(.4,0,.2,1)}
.bg{position:absolute;inset:0;transition:opacity .55s ease}
.bg-0{background:linear-gradient(to bottom,#ffc1e2,#ff62b6 65.509%)}
.bg-1{background:linear-gradient(to bottom,#ebebeb,#bebebe 65.278%)}
.bg-2{background:linear-gradient(to bottom,#ffe187,#e2b327 64.738%)}
.bg-3{background:linear-gradient(to bottom,#ebebeb,#1c1c1c 65.509%)}
.bg-4{background:#050505}
.bears{position:absolute;left:0;bottom:0;width:390px;height:580px;z-index:0;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bears.dragging{transition:none}
.slot{position:absolute;left:0;top:0;width:390px;height:580px;transition:transform .6s cubic-bezier(.65,0,.35,1),opacity .6s ease;will-change:transform;pointer-events:none}
.slot .lay{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.slot .lay>*{position:absolute;display:block}
.slot .lay svg{width:100%;height:100%}
.slot .sil{color:#050505}
.slot.on-dark .sil-side{color:#fff}
.slot .space-sil{color:#fff}
.slot.reveal .skin-lay{animation:reveal .6s ease}
@keyframes reveal{0%{filter:brightness(3) saturate(0);opacity:0}60%{filter:brightness(1.6)}100%{filter:none;opacity:1}}
.fade{position:absolute;z-index:1;pointer-events:none;left:0;right:0;bottom:0;height:293px;transition:opacity .55s ease,height .55s cubic-bezier(.4,0,.2,1)}
.collapsed .fade{height:351px}
.fade-0{background:linear-gradient(to bottom,rgba(255,98,182,0),#ff62b6 23.784%)}
.fade-1{background:linear-gradient(to bottom,rgba(190,190,190,0),#bebebe 23.784%)}
.fade-2{background:linear-gradient(to bottom,rgba(226,179,39,0),#e2b327 23.784%)}
.fade-3{background:linear-gradient(to bottom,rgba(28,28,28,0),#1c1c1c 23.784%)}
.fade-4{background:linear-gradient(to bottom,rgba(5,5,5,0),#050505 23.784%)}
.collapsed .fade-0{background:linear-gradient(to bottom,rgba(255,98,182,.646) 0%,#ff62b6 20.5%)}
.collapsed .fade-1{background:linear-gradient(to bottom,rgba(190,190,190,.646) 0%,#bebebe 20.5%)}
.collapsed .fade-2{background:linear-gradient(to bottom,rgba(226,179,39,.646) 0%,#e2b327 20.5%)}
.collapsed .fade-3{background:linear-gradient(to bottom,rgba(28,28,28,.646) 0%,#1c1c1c 20.5%)}
.collapsed .fade-4{background:linear-gradient(to bottom,rgba(5,5,5,.646) 0%,#050505 20.5%)}
.tapzone{position:absolute;top:200px;height:280px;width:70px;z-index:3}
.tapzone.prev{left:0}.tapzone.next{right:0}

/* Карточка профиля */
.card{position:absolute;left:10px;bottom:10px;width:370px;background:#fff;border-radius:32px;padding:18px 6px 6px;display:flex;flex-direction:column;gap:18px;z-index:4}
.card .who{display:flex;justify-content:center;align-items:center;gap:8px;height:22px;padding:0 14px;white-space:nowrap}
.card .who .av{flex:none;width:22px;height:22px;border-radius:50%;overflow:hidden;background:#fff}
.card .who .av img{width:22px;height:22px;object-fit:cover}
.card .who .dv{flex:none;width:1px;height:15px;background:#050505;opacity:.1}
.card .who b{font-size:17px;line-height:22px;font-weight:500;opacity:.5}
.card .who span{font-size:16px;opacity:.4}
.inner{background:rgba(0,0,0,.04);border-radius:28px;padding:12px;display:flex;flex-direction:column;gap:14px}
.grade{display:flex;flex-direction:column;gap:10px}
.grade .lbl{font-size:12px;line-height:14px;font-weight:400;color:var(--black);white-space:nowrap}
.inner .row{display:flex;gap:14px;align-items:center}
.ring{position:relative;flex:none;width:57px;height:57px}
.ring svg{position:absolute;inset:0}
.ring .arc{transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1)}
.ring .lvl{position:absolute;left:28px;top:14px;transform:translateX(-50%);font-size:24px;font-weight:600;color:var(--pink);line-height:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.txt .top{display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.txt .top b{font-size:20px;font-weight:600}
.txt .top span{font-size:16px;opacity:.4}
.pts{height:24px;display:flex;align-items:flex-end;gap:5px;line-height:1;white-space:nowrap;font-weight:600}
.pts .cur,.pts .sl{font-size:24px;color:var(--pink);font-variant-numeric:tabular-nums}
.pts .max{font-size:16px;opacity:.4;font-variant-numeric:tabular-nums}
.pts .maxed{font-size:16px;color:var(--pink)}
.swap{transition:opacity .25s ease,transform .25s ease}
.swap.out{opacity:0;transform:translateY(4px)}
.tabs{display:flex;align-items:center;gap:2px}
.tabs .link{flex:none;width:7px;height:1px;background:#050505;opacity:.14}
.tab{position:relative;flex:none;width:58px;height:43px;border-radius:1000px;box-shadow:0 0 0 1px rgba(0,0,0,.1);transition:transform .15s,box-shadow .4s ease}
.tab.open{box-shadow:0 0 0 1px rgba(0,0,0,0)}
.tab:active{transform:scale(.94)}
.tab .fill{position:absolute;inset:0;border-radius:1000px;opacity:0;transition:opacity .4s ease}
.tab.open .fill{opacity:1}
.tab .ic{position:absolute;left:calc(50% - .5px);top:calc(50% + .5px);width:24px;height:24px;transform:translate(-50%,-50%)}
.tab .ic img{position:absolute;inset:0;width:24px;height:24px;transition:opacity .35s}
.tab .ic .on{opacity:0}.tab.open .ic .on{opacity:1}.tab.open .ic .off{opacity:0}
.tab .sel{position:absolute;inset:-3px;border:3px solid var(--pink);border-radius:100px;opacity:0;transition:opacity .3s}
.tab.selected .sel{opacity:1}
.tab.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.f0{background:linear-gradient(to bottom,#ff62b6,#ffc1e2)}
.f1{background:linear-gradient(to bottom,#bebebe,#ebebeb)}
.f2{background:linear-gradient(to bottom,#ffd429,#fff0b6)}
.f3{background:linear-gradient(to bottom,#1c1c1c,#ebebeb 81.217%)}
.f4{background:#050505}

/* Шапка */
.head{position:absolute;left:16px;top:60px;width:358px;height:40px;display:flex;align-items:center;justify-content:space-between;z-index:6}
.head .back{width:40px;height:40px;border-radius:100px;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.head .back:active,.head .help:active{transform:scale(.9)}
.head .back img{width:24px;height:24px}
.head h1{flex:1;margin:0;text-align:center;font-size:24px;font-weight:600;color:#fff;text-transform:uppercase;line-height:normal}
.head .help{width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.head .help img{width:32px;height:32px}

/* Награды */
.rewards{position:absolute;left:16px;width:358px;top:var(--ch,580px);bottom:0;overflow:hidden;padding:16px 0 70px;transition:top .55s cubic-bezier(.4,0,.2,1);overscroll-behavior:contain;scrollbar-width:none}
.rewards::-webkit-scrollbar{display:none}
.collapsed .rewards{overflow-y:auto;-webkit-overflow-scrolling:touch}
.rewards h2{margin:0 0 16px;padding:0 12px;font-size:17px;font-weight:500;line-height:22px;letter-spacing:-.41px}
.list{display:flex;flex-direction:column;gap:8px}
.rcard{position:relative;height:var(--rh,88px);background:rgba(0,0,0,.04);border-radius:20px;padding:12px;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-start;transition:height .55s cubic-bezier(.4,0,.2,1)}
.rcard .pic{position:absolute;right:0;top:0;width:162px;height:127px}
.rcard .pic .rot{position:absolute;left:-2.53px;top:-17.21px;width:176.705px;height:176.705px;display:flex;align-items:center;justify-content:center}
.rcard .pic .rot img{width:145.24px;height:145.24px;transform:rotate(14.35deg);object-fit:cover}
.rcard .pic .mute{position:absolute;inset:0;background:#fff;mix-blend-mode:color;opacity:0;transition:opacity .4s}
.rcard .col{position:relative;width:216px;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.rcard .badge{background:var(--pink);color:#fff;font-size:14px;font-weight:600;line-height:normal;padding:2px 6px;border-radius:100px;white-space:nowrap;transition:background .4s}
.rcard .name{font-family:-apple-system,"SF Pro Text","Inter",sans-serif;font-size:14px;font-weight:500;line-height:1;white-space:nowrap;transition:opacity .4s}
.rcard .st{position:relative;flex:none;width:32px;height:32px;border-radius:100px;background:var(--green);transition:background .4s}
.rcard .st img{position:absolute;left:4px;top:4px;width:24px;height:24px;transition:opacity .35s}
.rcard .st .lk{opacity:0}
.rcard.locked .mute{opacity:1}
.rcard.locked .badge,.rcard.locked .st{background:var(--gray)}
.rcard.locked .name{opacity:.5}
.rcard.locked .st .ok{opacity:0}.rcard.locked .st .lk{opacity:1}
.rcard.unlock{animation:cardpop .45s ease}
@keyframes cardpop{40%{transform:scale(1.03)}}
.bfade{position:absolute;left:0;right:0;bottom:0;height:58px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);pointer-events:none;z-index:5}

/* Нарисованные системные панели из макета */
.sbar{display:none;position:absolute;left:0;top:0;width:390px;height:60px;z-index:20;align-items:center;pointer-events:none;color:var(--black)}
html.drawn .sbar{display:flex}
.sbar .l,.sbar .r{flex:1;display:flex;align-items:center;justify-content:center;height:60px}
.sbar .l{gap:4px;padding-left:42px}.sbar .r{gap:10px;padding-right:28px}
.sbar .island{flex:none;width:122px;height:36px;border-radius:32px;background:#030303;visibility:hidden}
html.framed .sbar .island{visibility:visible}
.sbar time{font:590 17px/14px -apple-system,"SF Pro Text","Inter",Arial,sans-serif;letter-spacing:-.5px;min-width:35px;text-align:center;font-variant-numeric:tabular-nums}
.sbar svg{display:block}
.sbar.light{color:#fff}
.sbar.light .inv{filter:invert(1)}
.batt{position:relative;width:27px;height:14px}
.batt .fill{position:absolute;left:0;top:0;height:14px;width:36.6%;border-radius:7px 0 0 7px;background:#f7ce45}
.batt b{position:absolute;left:0;top:0;width:24.7px;text-align:center;font:700 11px/14px -apple-system,"SF Pro Text","Inter",Arial,sans-serif;letter-spacing:-.5px;color:#050505}
.homebar{display:none;position:absolute;left:125px;bottom:8px;width:140px;height:5px;border-radius:2.5px;background:var(--black);z-index:20;pointer-events:none}
html.drawn .homebar{display:block}

/* Подсказка «на весь экран» */
.hint{position:absolute;left:10px;right:10px;bottom:84px;z-index:50;background:#050505;color:#fff;border-radius:28px;padding:18px;display:none;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:rise .5s cubic-bezier(.3,1.2,.5,1)}
.hint.on{display:flex}
@keyframes rise{from{transform:translateY(130%)}}
.hint h4{margin:0;font-size:17px;font-weight:600;padding-right:30px}
.hint p{margin:0;font-size:14px;line-height:1.35;opacity:.8}
.hint .go{height:52px;border-radius:100px;background:var(--pink);color:#fff;font-size:16px;font-weight:600}
.hint .x{position:absolute;right:10px;top:8px;width:36px;height:36px;font-size:24px;opacity:.5}
.hint .arrow{display:flex;justify-content:center;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.share{display:inline-block;vertical-align:-3px;width:16px;height:18px}

/* ---------- Прелоадер-видео ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#fff;transition:opacity .5s ease}
#intro.done{opacity:0;pointer-events:none}
#intro video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#fff}
#intro .skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:500 13px/1 -apple-system,"Inter",sans-serif;color:rgba(5,5,5,.45);padding:10px 14px;border-radius:100px;background:rgba(255,255,255,.7);opacity:0;transition:opacity .4s .8s}
#intro.playing .skip{opacity:1}
.switcher{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
html.intro-on .switcher{transform:translateY(110%)}
@media (min-width:640px) and (min-height:720px){ html.intro-on .switcher{transform:translateY(30px);opacity:0} .switcher{transition:transform .5s,opacity .5s} }

/* ---------- Модальное окно после автопоказа ---------- */
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:0 32px;background:rgba(5,5,5,.42);
  opacity:0;pointer-events:none;transition:opacity .3s ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.on{opacity:1;pointer-events:auto}
.modal .box{width:100%;max-width:326px;background:#fff;border-radius:28px;padding:28px 24px 20px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.25);transform:scale(.88) translateY(12px);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.modal.on .box{transform:none}
.modal .ic{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(to bottom,#ffc1e2,#ff62b6);display:flex;align-items:center;justify-content:center}
.modal p{font-size:20px;line-height:1.25;font-weight:600;color:var(--black);margin:0 0 22px;letter-spacing:-.01em}
.modal button{display:block;width:100%;height:52px;border-radius:100px;background:var(--pink);color:#fff;font-size:17px;font-weight:600}
.modal button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>


<div id="intro"><video id="introVid" muted playsinline webkit-playsinline preload="auto" poster="intro-poster.jpg"><source src="intro.mp4" type="video/mp4"><source src="intro.webm" type="video/webm"></video><button class="skip" id="introSkip">Пропустить</button></div>
<div class="stage">
  <div class="viewport" id="viewport">
    <div class="app" id="app">
      <div class="modal" id="doneModal" role="dialog" aria-modal="true" aria-labelledby="doneText">
        <div class="box">
          <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <p id="doneText">Теперь вы можете управлять интерфейсом</p>
          <button id="doneOk">ОК</button>
        </div>
      </div>
      <div class="container" id="container">
        <div class="bg bg-0"></div><div class="bg bg-1"></div><div class="bg bg-2"></div><div class="bg bg-3"></div><div class="bg bg-4"></div>
        <div class="bears" id="bears"></div>
        <div class="fade fade-0"></div><div class="fade fade-1"></div><div class="fade fade-2"></div><div class="fade fade-3"></div><div class="fade fade-4"></div>
        <button class="tapzone prev" id="tzPrev" aria-label="Предыдущий уровень"></button>

const NAMES=["Pink Bear","Silver Bear","Gold Bear","Diamond Bear","Galactic Bear"];
const R1=["(1–5 level)","(6–14 level)","(15–20 level)","(21–26 level)","(27 level)"];
const R3=["(1–5 level)","6–14 level","15–20 level","21–26 level","27 level"];
const MAX1=[5000,45000,450000,2500000,4500000];
const ARC1=[.79,.45,.14,.05,.02];
const STEPS=[{lvl:4,pts:3700,max:5000},{lvl:12,pts:40000,max:45000},{lvl:18,pts:400890,max:450000},{lvl:23,pts:4304490,max:4500000},{lvl:27}];
const BADGES=["3 lvl","4 lvl","5 lvl","5 lvl","5 lvl"];
const LIGHT_BAR=[false,false,false,false,true];

/* ---------- Построение DOM ---------- */
const bears=$('bears'), slots=[];
// геометрия из макета (координаты hero 390×580)
const SKIN=[[49.5,85,292,292],[42,88,308,308],[42,88,308,308],[47,88,296,296],[0,25,390,418]];
const NX=281.1, PX=-261.5;           // смещение боковых медведей
const px=(x,y,w,h)=>`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
for(let i=0;i<5;i++){
  const s=document.createElement('div'); s.className='slot';
  const lock = i===0?'' : i===4
    ? `<img src="${A.spaceLock}" style="${px(0,21.2,390,441.6)}" alt=""><div class="space-sil" style="${px(86.6,128,223.7,230.1)}">${SV.space}</div>`
    : `<div class="sil" style="${i===3?px(82.2,124.6,226.1,229.8):px(82,125,225,229)}">${i===3?SV.dia:SV.c}</div>`;
  s.innerHTML=
   `<div class="lay skin-lay"><img src="${A.skins[i]}" style="${px(...SKIN[i])}" alt=""></div>`+
   `<div class="lay"> ${lock}</div>`+
   `<div class="lay">${i>0?`<img src="${A.side[i-1]}" style="${px(25.9,98,311,311)}" alt="">`:''}</div>`+
   `<div class="lay"><div class="sil sil-side" style="${px(49.5,136.2,273.7,278.8)}">${SV.side}</div></div>`+
   `<div class="lay"><img src="${A.skins[i]}" style="${px(40.5,i===0?92:95,311,311)}" alt=""></div>`+
   `<div class="lay"><div class="sil sil-side" style="${px(54.1,136.2,273.7,278.8)}">${SV.side}</div></div>`;
  bears.appendChild(s); slots.push(s);
}
const tabsEl=$('tabs'), tabs=[];
for(let i=0;i<5;i++){
  const t=document.createElement('button'); t.className='tab'; t.setAttribute('aria-label',NAMES[i]);
  t.innerHTML=`<span class="fill f${i}"></span><span class="ic"><img class="off" src="${A.bearOff}" alt=""><img class="on" src="${A.bearOn}" alt=""></span><span class="sel"></span>`;
  t.addEventListener('click',()=>{ if(!busy) go(i); });
  if(i>0){ const l=document.createElement('span'); l.className='link'; tabsEl.appendChild(l); }
  tabsEl.appendChild(t); tabs.push(t);
}
const list=$('list'), rcards=[];
for(let i=0;i<5;i++){
  const c=document.createElement('div'); c.className='rcard';
  c.innerHTML=`<div class="pic"><div class="rot"><img src="${A.reward}" alt=""></div><div class="mute"></div></div>`+
   `<div class="col"><span class="badge">${BADGES[i]}</span><span class="name">Exclusive Gift</span></div>`+
   `<div class="st"><img class="ok" src="${A.check}" alt=""><img class="lk" src="${A.lock}" alt=""></div>`;
  list.appendChild(c); rcards.push(c);
}
const C=2*Math.PI*25.125, arc=$('arc'); arc.style.strokeDasharray=C;

/* ---------- Состояние ---------- */
let mode=3, cur=0, open=[true,false,false,false,false], stage3=0, busy=false, collapsed=false;
const bgs=[...document.querySelectorAll('.bg')], fades=[...document.querySelectorAll('.fade')];

function setArc(f){ arc.style.strokeDashoffset = C*(1-Math.max(0,Math.min(1,f))); }
function layoutSlots(){
  slots.forEach((s,i)=>{
    const d=i-cur, u=open[i]; let tx=0,ty=0,op=1;
    if(d===1) tx=NX; else if(d===-1) tx=PX;
    else if(d>1){ tx=NX+300*(d-1); op=0; } else if(d<-1){ tx=PX-300*(-d-1); op=0; }
    if(d===0 && collapsed) ty=-84;
    s.style.transform=`translate(${tx}px,${ty}px)`; s.style.opacity=op;
    s.classList.toggle('on-dark',cur===4);
    const L=s.querySelectorAll('.lay');
    const vis=[u&&d===0, !u&&d===0, u&&d>0, !u&&d>0, u&&d<0, !u&&d<0];
    const lev=[1,.2,.2,.2,.2,.2];
    L.forEach((l,k)=>l.style.opacity=vis[k]?lev[k]:0);
    s.style.zIndex = d===0?2:1;
  });
}
function textFor(i){
  if(mode===2) return {name:NAMES[i],range:"27 level",lvl:27,maxed:true,arc:1};
  if(mode===1) return {name:NAMES[i],range:R1[i],lvl:4,pts:3700,max:MAX1[i],arc:ARC1[i]};
  // mode 3
  const st=STEPS[stage3];
  if(stage3===4) return {name:NAMES[i],range:"27 level",lvl:27,maxed:true,arc:1};
  return {name:NAMES[i],range:R3[i],lvl:st.lvl,pts:st.pts,max:st.max,arc:.79};
}
function ptsHTML(t){ return t.maxed?`<span class="maxed">You have reached the max level!</span>`:`<span class="cur">${t.pts}</span><span class="sl">/</span><span class="max">${t.max}</span>`; }
function render(animText=true){
  bgs.forEach((b,i)=>b.style.opacity = i===cur?1:0);
  fades.forEach((b,i)=>b.style.opacity = i===cur?1:0);
  layoutSlots();
  tabs.forEach((t,i)=>{t.classList.toggle('open',open[i]); t.classList.toggle('selected',i===cur);});
  const lockedRewards = !open[cur];
  rcards.forEach(c=>c.classList.toggle('locked',lockedRewards));
  $('sbar').classList.toggle('light',LIGHT_BAR[cur]);
  const t=textFor(cur);
  const apply=()=>{ $('bname').textContent=t.name; $('brange').textContent=t.range; $('pts').innerHTML=ptsHTML(t); $('lvl').textContent=t.lvl; };
  if(animText){ ['topRow','pts'].forEach(id=>$(id).classList.add('out')); setTimeout(()=>{apply(); ['topRow','pts'].forEach(id=>$(id).classList.remove('out'));},220); }
  else apply();
  setArc(t.arc);
  $('tzPrev').hidden = cur===0; $('tzNext').hidden = cur===4;
}
function go(i){ if(i<0||i>4||i===cur) return; cur=i; render(); }

/* ---------- Переходы между уровнями ---------- */
$('tzNext').addEventListener('click',()=>{ if(!busy) go(cur+1); });
$('tzPrev').addEventListener('click',()=>{ if(!busy) go(cur-1); });
/* Свайп по медведю: медведи едут за пальцем, отпускание листает уровень */
const cont=$('container'), bearsEl=$('bears');
let drag=null;
cont.addEventListener('pointerdown',e=>{
  if(busy || (e.pointerType==='mouse' && e.button!==0)) return;
  drag={x:e.clientX,y:e.clientY,id:e.pointerId,dx:0,axis:null};
});
cont.addEventListener('pointermove',e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const s=scale(), dx=(e.clientX-drag.x)/s, dy=(e.clientY-drag.y)/s;
  if(!drag.axis){ if(Math.abs(dx)<6 && Math.abs(dy)<6) return; drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(drag.axis==='x'){ try{cont.setPointerCapture(e.pointerId);}catch(_){} bearsEl.classList.add('dragging'); } }
  if(drag.axis!=='x') return;
  const edge=(dx>0&&cur===0)||(dx<0&&cur===4);
  drag.dx = edge ? dx*.3 : dx;
  bearsEl.style.transform=`translateX(${drag.dx}px)`;
});
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  const d=drag; drag=null;
  if(d.axis!=='x') return;
  bearsEl.classList.remove('dragging'); bearsEl.style.transform='';
  suppressClick=true; setTimeout(()=>suppressClick=false,50);
  if(Math.abs(d.dx)>50) go(cur+(d.dx<0?1:-1));
}
let suppressClick=false;
cont.addEventListener('pointerup',endDrag);
cont.addEventListener('pointercancel',endDrag);
cont.addEventListener('click',e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } },true);

/* ---------- Сворачивание шапки при листании наград ---------- */
const app=$('app'), rew=$('rewards');
function setCollapsed(v){ if(collapsed===v) return; collapsed=v; app.classList.toggle('collapsed',v); app.style.setProperty('--ch',v?'351px':'580px'); layoutSlots(); if(!v) rew.scrollTop=0; }
// свайп вверх в любом месте экрана сворачивает шапку, вниз — разворачивает
let sw0=null;
app.addEventListener('touchstart',e=>{ const t=e.touches[0]; sw0={x:t.clientX,y:t.clientY,inRew:!!e.target.closest('.rewards')}; },{passive:true});
app.addEventListener('touchmove',e=>{
  if(!sw0) return; const t=e.touches[0], dx=t.clientX-sw0.x, dy=t.clientY-sw0.y;
  if(Math.abs(dy)<8 || Math.abs(dx)>Math.abs(dy)) return;          // горизонтальный жест — это листание медведей
  if(!collapsed && dy<0){ setCollapsed(true); sw0=null; if(e.cancelable) e.preventDefault(); }
  else if(collapsed && dy>10 && (!sw0.inRew || rew.scrollTop<=0)){ setCollapsed(false); sw0=null; if(e.cancelable) e.preventDefault(); }
  else if(!sw0.inRew && e.cancelable) e.preventDefault();
},{passive:false});
app.addEventListener('touchend',()=>{ sw0=null; },{passive:true});
app.addEventListener('wheel',e=>{
  const inRew=!!e.target.closest('.rewards');
  if(!collapsed && e.deltaY>0){ setCollapsed(true); e.preventDefault(); }
  else if(collapsed && e.deltaY<0 && (!inRew || rew.scrollTop<=0)){ setCollapsed(false); e.preventDefault(); }
},{passive:false});
// мышью: вертикальное перетаскивание по экрану (для десктопа)
let md=null;
app.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse' && e.button===0) md={y:e.clientY,x:e.clientX,inRew:!!e.target.closest('.rewards')}; });
addEventListener('pointerup',e=>{ if(!md) return; const dy=e.clientY-md.y, dx=e.clientX-md.x; const m=md; md=null;
  if(Math.abs(dy)<40 || Math.abs(dx)>Math.abs(dy)) return;
  if(!collapsed && dy<0) setCollapsed(true); else if(collapsed && dy>0 && (!m.inRew || rew.scrollTop<=0)) setCollapsed(false); });

/* ---------- Состояние 3: постепенное открытие ---------- */
const wait=ms=>new Promise(r=>{ const t=setTimeout(r,ms); timers.push(t); });
let timers=[], runId=0;
function countTo(el,from,to,ms,id){
  return new Promise(res=>{ const t0=performance.now();
    const f=now=>{ if(id!==runId) return res(); const p=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(from+(to-from)*e); p<1?requestAnimationFrame(f):res(); };
    requestAnimationFrame(f); });
}
async function playProgress(){
  const id=++runId; busy=true;
  stage3=0; cur=0; open=[true,false,false,false,false]; setCollapsed(false); render(false);
  setArc(0); await wait(60); setArc(.79);
  await wait(600); if(id!==runId) return;
  for(let k=1;k<=4;k++){
    // 1) докручиваем очки и кольцо текущего уровня до конца
    const st=STEPS[k-1], curEl=$('pts').querySelector('.cur');
    setArc(1);
    await Promise.all([ countTo(curEl,st.pts,st.max,450,id), countTo($('lvl'),st.lvl,[5,14,20,26][k-1],450,id) ]);
    if(id!==runId) return;
    await wait(100);
    // 2) открываем следующий уровень: вкладка и силуэт превращаются в скин
    open[k]=true; tabs[k].classList.add('pop'); slots[k].classList.add('reveal'); render(false);
    await wait(600); tabs[k].classList.remove('pop'); slots[k].classList.remove('reveal');
    if(id!==runId) return;
    // 3) переезжаем к новому медведю
    stage3=k; cur=k; render(true); setArc(0);
    rcards.forEach((c,j)=>{ c.classList.remove('unlock'); setTimeout(()=>{ if(id===runId){ c.classList.add('unlock'); } },200+j*60); });
    await wait(300); if(id!==runId) return;
    setArc(k===4?1:.79);
    if(k<4){ const ns=STEPS[k]; const ce=$('pts').querySelector('.cur'); await Promise.all([ countTo(ce,0,ns.pts,550,id), countTo($('lvl'),[5,14,20,26][k-1]+1,ns.lvl,550,id) ]); }
    await wait(k===4?300:450); if(id!==runId) return;
  }
  busy=false;
  mode=2; open=[true,true,true,true,true]; render(false);
  setTimeout(()=>{ if(id===runId) $('doneModal').classList.add('on'); },350);
}
$('doneOk').addEventListener('click',()=>$('doneModal').classList.remove('on'));

/* ---------- Переключатель состояний ---------- */
function setMode(m){
  runId++; timers.forEach(clearTimeout); timers=[]; busy=false;
  mode=m;
  slots.forEach(s=>s.classList.remove('reveal')); tabs.forEach(t=>t.classList.remove('pop'));
  setCollapsed(false);
  if(m===1){ open=[true,false,false,false,false]; cur=0; render(false); }
  else if(m===2){ open=[true,true,true,true,true]; cur=4; render(false); }
  else playProgress();
}
window.setMode=setMode;

/* ---------- Масштаб под экран ---------- */
const vp=$('viewport'), root=document.documentElement;
const framedMQ=matchMedia('(min-width:640px) and (min-height:720px)');
let S=1;
function scale(){ return S; }
function fit(){
  const framed=framedMQ.matches; root.classList.toggle('framed',framed);
  if(framed){
    const avail=innerHeight-60; S=Math.min(1,avail/844);
    vp.style.width=390*S+'px'; vp.style.height=844*S+'px';
    app.style.height='844px';
  } else {
    vp.style.width=''; vp.style.height='';
    const w=vp.clientWidth, h=vp.clientHeight; S=w/390;
    app.style.height=(h/S)+'px';
  }
  app.style.transform=`scale(${S})`;
  syncDrawn();
}
addEventListener('resize',fit);

/* ---------- Полный экран и нарисованные панели ---------- */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isPhone=matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<600;
const canFS=!isIOS&&!!(root.requestFullscreen||root.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function syncDrawn(){ root.classList.toggle('drawn', isFS()||framedMQ.matches); }
function tickClock(){ const d=new Date(); $('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
tickClock(); setInterval(tickClock,10000);
if(navigator.getBattery) navigator.getBattery().then(b=>{ const s=()=>{ const p=Math.round(b.level*100); $('battNum').textContent=p; const f=$('battFill'); f.style.width=(b.level*24.7/27*100)+'%'; f.style.borderRadius=p>96?'7px':''; f.style.background=p<=20?'#f6655a':(p<=40?'#f7ce45':'#9bdb60'); }; s(); b.addEventListener('levelchange',s); }).catch(()=>{});
const hint=$('hint'), showHint=()=>hint.classList.add('on'), hideHint=()=>hint.classList.remove('on');
$('hintX').onclick=hideHint;
async function goFS(){ try{ await (root.requestFullscreen?root.requestFullscreen({navigationUI:'hide'}):root.webkitRequestFullscreen()); }catch(e){ return; } try{ await screen.orientation.lock('portrait'); }catch(e){} hideHint(); }
const onFS=()=>{ setTimeout(fit,50); if(!isFS()&&canFS&&isPhone) setTimeout(showHint,600); };
document.addEventListener('fullscreenchange',onFS); document.addEventListener('webkitfullscreenchange',onFS);
const inFrame=(()=>{ try{ return window.top!==window; }catch(e){ return true; } })();
if(isPhone&&!standalone){
  if(canFS){ $('hintGo').onclick=goFS; afterIntro(()=>setTimeout(showHint,500)); }
  else if(isIOS&&!inFrame){
    $('hintGo').onclick=()=>{ $('hintTitle').textContent='Почти готово';
      $('hintText').innerHTML='Нажмите <b>⋯</b> или <svg class="share" viewBox="0 0 16 18" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V1M4.5 4.5 8 1l3.5 3.5M5 7H2.5v10h11V7H11"/></svg> внизу экрана и выберите «На экран „Домой“». Иконка откроет прототип как приложение.';
      $('hintGo').hidden=true; $('hintArrow').hidden=false; };
    afterIntro(()=>setTimeout(showHint,500));
  }
}
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- Прелоадер ---------- */
const intro=$('intro'), vid=$('introVid');
function afterIntro(f){ introDone?f():introCbs.push(f); }
window.afterIntro=afterIntro;
root.classList.add('intro-on');
function placeIntro(){
  // ролик 3:4 — по центру на белом фоне, края растворяются
  const W=innerWidth, H=innerHeight, framed=framedMQ.matches;
  let w=W, h=W*4/3;
  if(framed || h>H){ h=Math.min(H*(framed?.86:1), H); w=h*3/4; if(w>W){ w=W; h=w*4/3; } }
  Object.assign(vid.style,{left:(W-w)/2+'px',top:(H-h)/2+'px',width:w+'px',height:h+'px',objectFit:'cover',
    borderRadius:framed?'22px':'0',boxShadow:framed?'0 30px 80px -30px rgba(40,25,30,.35)':'none'});
}
// экран мокапа в последнем кадре ролика (координаты кадра 450×600)
const FIN={x:115.8,y:63.68,w:218.4,h:472.64,r:28.56};
function finishIntro(morph){
  if(introDone) return; introDone=true;
  root.classList.remove('intro-on');
  const done=()=>{ intro.classList.add('done'); setTimeout(()=>intro.remove(),600); };
  if(morph===true){
    // остаётся только экран мокапа — он плавно вырастает до размера прототипа и растворяется в нём
    const L=parseFloat(vid.style.left), T=parseFloat(vid.style.top), W=parseFloat(vid.style.width), f=W/450;
    const sx=FIN.x*f, sy=FIN.y*f, sw=FIN.w*f, sh=FIN.h*f;
    const tr=vp.getBoundingClientRect(), m=tr.width/sw;
    const tx=tr.left-L-m*sx, ty=tr.top-T-m*sy;
    const H=parseFloat(vid.style.height);
    vid.style.boxShadow='none'; $('introSkip').style.display='none';
    vid.style.clipPath=`inset(0px 0px 0px 0px round ${framedMQ.matches?22:0}px)`;
    intro.style.transition='background-color .35s ease 1.0s';
    requestAnimationFrame(()=>{
      vid.style.transition='clip-path .55s cubic-bezier(.4,0,.2,1), transform .85s cubic-bezier(.65,0,.35,1) .25s, opacity .35s ease 1.05s';
      vid.style.clipPath=`inset(${sy}px ${W-sx-sw}px ${H-sy-sh}px ${sx}px round ${FIN.r*f}px)`;
      vid.style.transformOrigin='0 0';
      vid.style.transform=`translate(${tx}px,${ty}px) scale(${m})`;
      intro.style.backgroundColor='rgba(255,255,255,0)';
      vid.style.opacity='0';
    });
    setTimeout(()=>{ intro.remove(); },1550);
  } else done();
  introCbs.splice(0).forEach(f=>setTimeout(f, morph===true?1500:0));
}
addEventListener('resize',placeIntro);
vid.addEventListener('ended',()=>finishIntro(true));
vid.addEventListener('timeupdate',()=>{ if(vid.duration && vid.currentTime>=vid.duration-0.04) finishIntro(true); });
vid.addEventListener('playing',()=>intro.classList.add('playing'));
vid.addEventListener('error',finishIntro,true);
$('introSkip').addEventListener('click',()=>finishIntro(false));
const tryPlay=vid.play(); if(tryPlay&&tryPlay.catch) tryPlay.catch(()=>{ setTimeout(finishIntro,300); });
setTimeout(()=>{ if(!introDone && vid.currentTime===0) finishIntro(); },3000);   // если видео не стартовало
setTimeout(finishIntro,10000);                                                      // страховка

fit(); render(false); setArc(.79); placeIntro();
afterIntro(()=>setTimeout(()=>{ if(mode===3) playProgress(); },400));
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
